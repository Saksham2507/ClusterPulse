global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The three cluster nodes (node_exporter)
  - job_name: node
    static_configs:
      - targets: ["node1:9100", "node2:9100", "node3:9100"]
        labels:
          cluster: clusterpulse

  # The remediation daemon's own metrics (self-healing telemetry)
  - job_name: remediation-daemon
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["remediation-daemon:8088"]
